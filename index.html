<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>نظام الطلبات الداخلية | UTiTCo</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@400;500;600;700&display=swap">
<style>
html{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}
/* Layout: sticky brand bar, identity band with leave balance, tabbed worklists; details in a side sheet; official A4 forms on fixed white paper. */
:root{
  --bg:#F1F5F2; --surface:#FFFFFF; --surface-2:#E7EEEA; --line:#D3DDD7; --line-2:#BFCDC5;
  --ink:#1A2923; --ink-2:#54665D; --ink-3:#7C8C84;
  --brand:#557D6C; --brand-ink:#3C6252; --brand-soft:#DCE9E2; --btn:#476E5E; --btn-ink:#FFFFFF;
  --coral:#E2704F; --coral-ink:#B84A2C; --coral-soft:#FBE7E0;
  --ok:#2C7A54; --ok-soft:#DDF0E5; --wait:#96650F; --wait-soft:#FBEFD2; --bad:#B93A2B; --bad-soft:#FBE3DF; --bad-line:#EBB3AB;
  --shadow:0 12px 40px rgba(20,40,32,.18); --scrim:rgba(16,28,23,.48); --logo-plate:transparent;
  --f-text:'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif;
  --f-head:'Readex Pro','IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif;
  --f-sign:'Aref Ruqaa','Amiri','Traditional Arabic',serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1613; --surface:#17211D; --surface-2:#1E2B26; --line:#2B3B34; --line-2:#3A4D45;
  --ink:#E7EFEB; --ink-2:#A3B5AC; --ink-3:#7F9188;
  --brand:#7DAE99; --brand-ink:#9CC7B4; --brand-soft:#23382F; --btn:#557D6C; --btn-ink:#FFFFFF;
  --coral:#EE8566; --coral-ink:#F39D83; --coral-soft:#3A241D;
  --ok:#6CC499; --ok-soft:#1B3528; --wait:#E3B55A; --wait-soft:#372C14; --bad:#F08A7C; --bad-soft:#3B1F1B; --bad-line:#6B332B;
  --shadow:0 12px 40px rgba(0,0,0,.5); --scrim:rgba(0,0,0,.6); --logo-plate:#F1F5F2; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1613; --surface:#17211D; --surface-2:#1E2B26; --line:#2B3B34; --line-2:#3A4D45;
  --ink:#E7EFEB; --ink-2:#A3B5AC; --ink-3:#7F9188;
  --brand:#7DAE99; --brand-ink:#9CC7B4; --brand-soft:#23382F; --btn:#557D6C; --btn-ink:#FFFFFF;
  --coral:#EE8566; --coral-ink:#F39D83; --coral-soft:#3A241D;
  --ok:#6CC499; --ok-soft:#1B3528; --wait:#E3B55A; --wait-soft:#372C14; --bad:#F08A7C; --bad-soft:#3B1F1B; --bad-line:#6B332B;
  --shadow:0 12px 40px rgba(0,0,0,.5); --scrim:rgba(0,0,0,.6); --logo-plate:#F1F5F2; color-scheme:dark}
:root[data-theme="light"]{color-scheme:light}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-text);font-size:14.5px;line-height:1.6;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3,h4{font-family:var(--f-head);margin:0;text-wrap:balance;line-height:1.35}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--coral);outline-offset:2px;border-radius:4px}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.wrap{max-width:1180px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px 16px;flex-wrap:wrap;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;margin-inline-end:auto}
.brand img{height:40px;width:auto;background:var(--logo-plate);border-radius:8px;padding:3px}
.brand b{font-family:var(--f-head);font-weight:600;font-size:17px;display:block;line-height:1.25}
.brand small{color:var(--ink-2);font-size:12px;letter-spacing:.04em}
.as{display:flex;align-items:center;gap:8px;min-width:0}
.as label{font-size:12.5px;color:var(--ink-2);white-space:nowrap}
.as select{min-width:0;max-width:100%}
.iconbtn{height:38px;min-width:38px;padding:0 10px;border:1px solid var(--line-2);background:var(--surface);border-radius:8px;font-weight:600;font-size:13px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.iconbtn:hover{background:var(--surface-2)}
.iconbtn svg{width:18px;height:18px}
select,input[type=text],input[type=search],input[type=number],input[type=date],textarea{background:var(--surface);border:1px solid var(--line-2);border-radius:8px;padding:8px 10px;min-height:38px;width:100%}
textarea{resize:vertical;min-height:72px;line-height:1.6}
select{padding-inline-end:28px}

/* identity band */
.id{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) auto;gap:16px 28px;align-items:center;padding-block:20px 16px}
.who{display:flex;gap:14px;align-items:center;min-width:0}
.av{flex:none;width:52px;height:52px;border-radius:50%;background:var(--brand-soft);color:var(--brand-ink);display:grid;place-items:center;font-family:var(--f-head);font-weight:600;font-size:18px}
.who h1{font-size:21px;font-weight:600}
.who p{color:var(--ink-2);font-size:13px}
.bal{min-width:0}
.bal .lb{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--ink-2)}
.bal .lb b{color:var(--ink);font-size:15px;font-family:var(--f-head)}
.meter{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-top:6px;border:1px solid var(--line)}
.meter i{display:block;height:100%;background:var(--brand);border-radius:99px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:8px 16px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface);font-weight:600;font-size:14px;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--btn);border-color:var(--btn);color:var(--btn-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.coral{background:var(--coral);border-color:var(--coral);color:#fff}
.btn.no{color:var(--bad);border-color:var(--bad-line)}
.btn.no:hover{background:var(--bad-soft)}
.btn.sm{min-height:32px;padding:4px 10px;font-size:13px}
.btn[disabled]{opacity:.55;cursor:default}
.btn svg{width:17px;height:17px;flex:none}

/* guide */
.guide{background:var(--brand-soft);border-radius:10px;padding:12px 16px;display:flex;gap:6px 22px;flex-wrap:wrap;align-items:center;font-size:13px;margin-bottom:14px}
.guide b{font-family:var(--f-head);font-weight:600;color:var(--brand-ink)}
.guide ol{display:flex;flex-wrap:wrap;gap:4px 20px;margin:0;padding-inline-start:18px;flex:1;min-width:220px}
.guide button{background:none;border:0;color:var(--ink-2);text-decoration:underline;font-size:12.5px;padding:4px}

/* tabs */
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;font-weight:500;color:var(--ink-2);white-space:nowrap;display:inline-flex;gap:8px;align-items:center;margin-bottom:-1px}
.tab:hover{color:var(--ink)}
.tab[aria-selected=true]{color:var(--brand-ink);border-bottom-color:var(--coral);font-weight:600}
.cnt{background:var(--coral);color:#fff;border-radius:99px;min-width:22px;height:22px;padding:0 6px;font-size:12px;font-weight:700;display:inline-grid;place-items:center;line-height:1}
.panel{padding-block:16px 28px}

/* tools + rows */
.tools{display:grid;grid-template-columns:minmax(0,1fr) 190px 190px;gap:10px;margin-bottom:12px}
.rows{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.rhead,.row{display:grid;grid-template-columns:150px 150px minmax(0,1fr) minmax(0,1.5fr) 220px;gap:12px;align-items:center;padding:10px 16px;text-align:start}
.rhead{font-size:12px;color:var(--ink-2);font-weight:600;background:var(--surface-2);letter-spacing:.02em}
.rows.mine .rhead,.rows.mine .row{grid-template-columns:150px 160px minmax(0,2fr) 240px}
.rows.mine .c-who{display:none}
.row{width:100%;background:none;border:0;border-top:1px solid var(--line);min-height:62px}
.row:hover{background:var(--surface-2)}
.row>span{min-width:0;display:block}
.row small{display:block;color:var(--ink-3);font-size:12px}
.c-ref b{font-family:var(--f-head);font-weight:600;font-size:13.5px}
.c-type{display:flex!important;align-items:center;gap:8px;font-weight:500}
.ic{flex:none;width:30px;height:30px;border-radius:8px;background:var(--brand-soft);color:var(--brand-ink);display:grid;place-items:center}
.ic svg{width:17px;height:17px}
.c-sum{color:var(--ink-2);overflow-wrap:anywhere}
.c-st{display:flex!important;flex-direction:column;align-items:flex-start;gap:3px}
.row.late{background:var(--bad-soft);box-shadow:inset 0 0 0 1px var(--bad-line)}
.row.late:hover{filter:brightness(.98)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:2px 10px;font-size:12.5px;font-weight:600;line-height:1.7;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.pending{background:var(--wait-soft);color:var(--wait)}
.pill.approved{background:var(--ok-soft);color:var(--ok)}
.pill.rejected{background:var(--bad-soft);color:var(--bad)}
.pill.late{background:var(--bad);color:var(--surface)}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.empty{padding:36px 16px;text-align:center;color:var(--ink-2)}
.empty b{display:block;font-family:var(--f-head);color:var(--ink);font-size:16px;margin-bottom:4px}

/* overlays */
.ov{position:fixed;inset:0;z-index:20;background:var(--scrim);display:flex}
.sheet{background:var(--surface);box-shadow:var(--shadow);display:flex;flex-direction:column;min-width:0;max-height:100%}
.ov.side{justify-content:flex-end}
.ov.side .sheet{width:min(560px,100%);height:100%}
.ov.mid{align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) 16px max(16px,env(safe-area-inset-bottom,0px))}
.ov.mid .sheet{width:min(720px,100%);border-radius:14px;max-height:100%}
.ov.full .sheet{width:100%;height:100%;background:var(--bg)}
.sh-h{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap;padding-top:max(14px,env(safe-area-inset-top,0px))}
.sh-h h2{font-size:18px;font-weight:600;margin-inline-end:auto;min-width:0}
.sh-b{padding:18px;overflow-y:auto;flex:1;min-height:0;display:flex;flex-direction:column;gap:18px}
.sh-f{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;padding-bottom:max(12px,env(safe-area-inset-bottom,0px))}
.x{border:0;background:none;width:36px;height:36px;border-radius:8px;display:grid;place-items:center;color:var(--ink-2)}
.x:hover{background:var(--surface-2)}
.x svg{width:20px;height:20px}
.sec h3{font-size:12.5px;font-weight:600;color:var(--ink-2);letter-spacing:.03em;margin-bottom:8px}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 18px;margin:0}
.kv dt{color:var(--ink-2);font-size:13px}
.kv dd{margin:0;font-weight:500;overflow-wrap:anywhere}
.mini{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
.mini th,.mini td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:start}
.mini th{color:var(--ink-2);font-weight:600;font-size:12px}
.scroll-x{overflow-x:auto}

/* timeline */
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.tl li{display:grid;grid-template-columns:26px minmax(0,1fr);gap:12px;position:relative;padding-bottom:16px}
.tl li:last-child{padding-bottom:0}
.tl li:not(:last-child)::before{content:"";position:absolute;inset-inline-start:12px;top:26px;bottom:0;width:2px;background:var(--line)}
.dot{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;border:2px solid var(--line-2);color:var(--ink-3);background:var(--surface)}
.dot.approved{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.dot.rejected{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.dot.now{border-color:var(--wait);color:var(--wait);background:var(--wait-soft)}
.tl b{font-weight:600}
.tl .when{color:var(--ink-2);font-size:12.5px}
.tl q{display:block;quotes:none;background:var(--surface-2);border-radius:8px;padding:6px 10px;margin-top:6px;font-size:13.5px}
.tl li.rej q{background:var(--bad-soft);color:var(--bad)}
.act{background:var(--surface-2);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.act .bts{display:flex;gap:10px;flex-wrap:wrap}
.note{font-size:13px;color:var(--ink-2)}
.err{color:var(--bad);font-size:12.5px;font-weight:500}

/* form */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{border:1px solid var(--line-2);background:var(--surface);border-radius:10px;padding:10px 12px;text-align:start;display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 10px;align-items:center}
.tile .ic{grid-row:span 2}
.tile b{font-weight:600}
.tile small{color:var(--ink-2);font-size:11.5px;line-height:1.4}
.tile:hover{background:var(--surface-2)}
.tile[aria-pressed=true]{border-color:var(--brand);background:var(--brand-soft);box-shadow:inset 0 0 0 1px var(--brand)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f.wide{grid-column:1/-1}
.f>label,.f>span.l{font-size:13px;font-weight:500}
.f .hint{font-size:12px;color:var(--ink-2)}
.f [aria-invalid=true]{border-color:var(--bad)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg label{border:1px solid var(--line-2);border-radius:8px;padding:6px 14px;cursor:pointer;display:inline-flex;gap:6px;align-items:center;min-height:38px}
.seg input{accent-color:var(--brand)}
.live{background:var(--brand-soft);border-radius:10px;padding:10px 14px;display:flex;gap:6px 24px;flex-wrap:wrap;font-size:13.5px}
.live span b{font-family:var(--f-head);font-weight:600}
.items{display:flex;flex-direction:column;gap:8px}
.item{display:grid;grid-template-columns:minmax(0,1fr) 84px 120px 36px;gap:8px;align-items:start}

/* stats */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.kpi span{font-size:12.5px;color:var(--ink-2)}
.kpi b{display:block;font-family:var(--f-head);font-size:28px;font-weight:600;line-height:1.3}
.kpi.bad b{color:var(--bad)}
.kpi small{color:var(--ink-3);font-size:12px}
.charts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.chart{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.chart h3{font-size:14.5px;font-weight:600;margin-bottom:12px}
.bar{display:grid;grid-template-columns:118px minmax(0,1fr) 28px;gap:10px;align-items:center;font-size:13px;margin-bottom:8px}
.bar i{display:block;height:14px;border-radius:4px;background:var(--brand);min-width:2px}
.bar.c i{background:var(--coral)}
.bar .t{background:var(--surface-2);border-radius:4px}
.bar b{text-align:end;font-weight:600}
.stack{display:flex;height:22px;border-radius:6px;overflow:hidden;gap:2px;background:var(--surface)}
.stack i{display:block;height:100%;min-width:3px}
.lg{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:12px;font-size:13px}
.lg span{display:inline-flex;align-items:center;gap:6px}
.lg span::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--c)}
.scope{font-size:12.5px;color:var(--ink-2);margin-bottom:12px}

/* verify */
.verify{max-width:640px;display:flex;flex-direction:column;gap:14px}
.vf{display:flex;gap:8px}
.vf input{flex:1;min-width:0;direction:ltr;text-align:start;text-transform:uppercase}
.vres{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px}
.vres.ok{border-color:var(--ok)}.vres.no{border-color:var(--bad-line)}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--ink-2)}
.chip{border:1px solid var(--line-2);background:var(--surface);border-radius:99px;padding:2px 10px;font-size:12.5px}

/* doc viewer */
.docbar{background:var(--surface)}
.docstage{flex:1;min-height:0;overflow:auto;padding:18px 12px 28px}
.fit{position:relative;margin:0 auto;box-shadow:0 4px 24px rgba(0,0,0,.25);background:#fff}
.fit .paper{position:absolute;top:0;left:0;transform-origin:0 0}

/* footer */
.foot{border-top:1px solid var(--line);margin-top:8px}
.foot .wrap{padding-block:16px 24px;display:flex;gap:12px 20px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.demo{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--ink-2);max-width:720px}
.demo strong{color:var(--coral-ink);font-family:var(--f-head);font-weight:600;white-space:nowrap}
.toast{position:fixed;z-index:40;inset-inline:0;bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;pointer-events:none;padding-inline:16px}
.toast>div{pointer-events:auto;background:var(--ink);color:var(--bg);border-radius:10px;padding:10px 14px;display:flex;gap:12px;align-items:center;box-shadow:var(--shadow);font-size:13.5px;max-width:560px}
.toast button{background:none;border:1px solid currentColor;color:inherit;border-radius:6px;padding:3px 10px;font-weight:600;white-space:nowrap}

@media (max-width:860px){
  .id{grid-template-columns:minmax(0,1fr);gap:12px}
  .id .btn{width:100%}
  .tools{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tools input{grid-column:1/-1}
  .rhead{display:none}
  .row,.rows.mine .row{grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;padding:12px 14px}
  .row:first-of-type{border-top:0}
  .c-sum,.c-st{grid-column:1/-1}
  .c-st{flex-direction:row!important;flex-wrap:wrap;align-items:center!important;gap:6px 10px!important}
  .c-who{grid-column:1/-1}
  .c-who small{display:inline;margin-inline-start:6px}
  .kpis,.charts{grid-template-columns:repeat(2,minmax(0,1fr))}
  .charts{grid-template-columns:minmax(0,1fr)}
  .ov.mid{padding:0}.ov.mid .sheet{border-radius:0;height:100%;width:100%}
}
@media (max-width:520px){
  .as{width:100%}.as select{flex:1}
  .tiles,.grid2{grid-template-columns:minmax(0,1fr)}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .item{grid-template-columns:minmax(0,1fr) 64px 92px 34px;gap:6px}
  .bar{grid-template-columns:92px minmax(0,1fr) 24px}
  .who h1{font-size:18px}
  .kpi b{font-size:23px}
}
@media (prefers-reduced-motion:no-preference){
  .ov .sheet{animation:in .18s ease-out}
  @keyframes in{from{opacity:.4;transform:translateY(8px)}to{opacity:1;transform:none}}
}

/* ============ official A4 paper: fixed print colours by design ============ */
.paper{width:794px;height:1123px;background:#fff;color:#1c2925;font-family:'IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif;font-size:12.5px;line-height:1.65;padding:30px 46px 22px;display:flex;flex-direction:column;position:relative;overflow:hidden;text-align:start}
.paper *{box-sizing:border-box}
.dc-head{display:grid;grid-template-columns:1fr 110px 1fr;align-items:center;direction:ltr;gap:10px}
.dc-head .en{text-align:left;direction:ltr}.dc-head .ar{text-align:right;direction:rtl}
.dc-head b{display:block;font-family:'Readex Pro','IBM Plex Sans Arabic',sans-serif;font-weight:600;font-size:16px;color:#3c6252;line-height:1.4}
.dc-head span{display:block;font-size:10.5px;color:#55665e;line-height:1.55}
.dc-head img{height:86px;width:auto;display:block;margin:0 auto}
.dc-rule{height:4px;background:#557D6C;margin-top:10px;position:relative}
.dc-rule i{position:absolute;top:0;bottom:0;inset-inline-start:0;width:120px;background:#E2704F}
.dc-rule2{height:1px;background:#557D6C;margin-top:2px}
.dc-meta{display:flex;justify-content:space-between;gap:16px;font-size:11.5px;margin-top:9px;color:#33443d}
.dc-meta b{font-weight:600;color:#1c2925}
.dc-title{text-align:center;margin:12px 0 10px}
.dc-title h2{font-family:'Readex Pro','IBM Plex Sans Arabic',sans-serif;font-size:20px;font-weight:700;color:#2f5244;line-height:1.3}
.dc-title span{display:block;font-size:10.5px;letter-spacing:.14em;color:#B84A2C;font-weight:600;margin-top:2px}
.dc-main{flex:1;min-height:0;display:flex;flex-direction:column;gap:9px;position:relative}
.dc-h{font-family:'Readex Pro','IBM Plex Sans Arabic',sans-serif;font-size:12px;font-weight:600;color:#2f5244;display:flex;align-items:center;gap:7px;margin-bottom:4px}
.dc-h::before{content:"";width:8px;height:8px;background:#E2704F;flex:none}
.dc-t{width:100%;border-collapse:separate;border-spacing:0;border-top:1px solid #8fa89c;border-inline-start:1px solid #8fa89c;table-layout:fixed}
.dc-t th,.dc-t td{border-bottom:1px solid #8fa89c;border-inline-end:1px solid #8fa89c;padding:4px 8px;text-align:start;vertical-align:middle;overflow-wrap:anywhere}
.dc-t th{background:#EAF2EE;color:#2f5244;font-weight:600;font-size:11.5px}
.dc-t td.c,.dc-t th.c{text-align:center}
.dc-t td.n,.dc-t th.n{text-align:end;font-variant-numeric:tabular-nums}
.dc-t .ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
.dc-t tfoot td{font-weight:600}
.dc-t tfoot tr.g td{background:#EAF2EE;color:#2f5244}
.dc-t.blank td{height:26px}
.dc-box{border:1px solid #8fa89c;background:#F6FAF8;padding:7px 11px;font-size:12px}
.dc-box .en{direction:ltr;text-align:left;font-size:11.5px;color:#33443d;margin-top:2px}
.dc-pledge{border-inline-start:3px solid #E2704F;background:#FDF5F2;padding:7px 12px;font-size:12px;text-align:justify}
.dc-bal{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.dc-bal div{border:1px solid #8fa89c;padding:5px 8px;text-align:center}
.dc-bal span{display:block;font-size:11px;color:#55665e}
.dc-bal b{font-family:'Readex Pro',sans-serif;font-size:16px;font-weight:600;color:#2f5244}
.dc-lines i{display:block;border-bottom:1px dotted #7c8c84;height:24px}
.dc-fill{display:grid;gap:8px 18px;font-size:12px}
.dc-fill span{display:flex;gap:6px;align-items:flex-end;white-space:nowrap}
.dc-fill span::after{content:"";flex:1;border-bottom:1px dotted #7c8c84;margin-bottom:4px}
.dc-two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dc-two>div{border:1px solid #8fa89c;padding:7px 10px}
.sig{font-family:'Aref Ruqaa','Amiri',serif;font-size:21px;color:#1d3a6e;line-height:1.1;display:inline-block;transform:rotate(-3deg);white-space:nowrap}
.ok-t{color:#2C7A54;font-weight:600}.no-t{color:#B93A2B;font-weight:600}.wt-t{color:#7c8c84}
.dc-seal{display:flex;justify-content:space-between;align-items:center;gap:16px;min-height:112px;margin-top:auto}
.dc-seal p{font-size:11.5px;color:#33443d;max-width:470px}
.dc-seal p b{color:#B93A2B}
.dc-seal img{width:112px;height:112px;transform:rotate(-9deg);flex:none}
.dc-ph{width:100px;height:100px;border-radius:50%;border:1.5px dashed #a9b8b0;display:grid;place-items:center;text-align:center;font-size:10.5px;color:#8a9a92;flex:none;line-height:1.4;padding:10px}
.dc-wm{position:absolute;top:470px;left:0;width:794px;text-align:center;font-family:'Readex Pro','IBM Plex Sans Arabic',sans-serif;font-weight:700;font-size:104px;line-height:1.3;transform:rotate(-32deg);opacity:.075;color:#557D6C;pointer-events:none;white-space:nowrap}
.dc-wm.rej{color:#B93A2B;opacity:.085}
.dc-wm.en{font-size:60px;letter-spacing:.03em}
.dc-foot{border-top:1px solid #8fa89c;margin-top:8px;padding-top:8px;display:flex;gap:12px;align-items:center;font-size:10px;color:#55665e;line-height:1.6}
.dc-foot img,.dc-foot .qrph{width:60px;height:60px;flex:none;image-rendering:pixelated}
.dc-foot .qrph{border:1px solid #8fa89c;display:grid;place-items:center;font-size:8px;text-align:center}
.dc-foot b{color:#1c2925;font-weight:600}
.dc-foot em{font-style:normal;color:#B84A2C;font-weight:600}
.dc-foot .pg{margin-inline-start:auto;white-space:nowrap;align-self:flex-end}
.lt{font-size:13.5px;line-height:2;display:flex;flex-direction:column;gap:10px}
.lt p{text-align:justify}
.lt .to{font-weight:600;font-size:14px;display:flex;justify-content:space-between}
.lt-sign{display:flex;justify-content:flex-end;align-items:center;gap:22px;margin-top:auto;min-height:150px}
.lt-sign .blk{text-align:center;font-size:13px;line-height:1.8}
.lt-sign .blk b{display:block;font-weight:600}
.lt-sign .sig{font-size:30px;margin:6px 0}
.lt-sign img{width:122px;height:122px;transform:rotate(-9deg)}
.dc-cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.paper.tight{font-size:12px;line-height:1.5}
.paper.tight .dc-main{gap:7px}
.paper.tight .dc-t th,.paper.tight .dc-t td{padding:3px 8px}
.paper.tight .dc-title{margin:9px 0 7px}
.paper.tight .dc-seal{min-height:100px}
.paper.tight .dc-seal img{width:100px;height:100px}
.paper.tight .dc-pledge,.paper.tight .dc-box{padding:5px 11px;font-size:11.5px}
.paper.tight .dc-h{margin-bottom:3px}
.dc-appr tbody td{height:36px}
.paper.tight .dc-appr tbody td{height:33px}
.paper.tight .dc-lines i{height:21px}
.paper.tight .dc-t.blank td{height:23px}
.paper.dense{font-size:11px;line-height:1.4;padding-top:24px}
.paper.dense .dc-head img{height:72px}
.paper.dense .dc-title{margin:7px 0 5px}
.paper.dense .dc-title h2{font-size:18px}
.paper.dense .dc-main{gap:6px}
.paper.dense .dc-t th,.paper.dense .dc-t td{padding:2px 8px}
.paper.dense .dc-t th{font-size:10.5px}
.paper.dense .dc-appr tbody td{height:29px}
.paper.dense .sig{font-size:18px}
.paper.dense .dc-seal{min-height:86px}
.paper.dense .dc-seal img{width:86px;height:86px}
.paper.dense .dc-ph{width:80px;height:80px;font-size:9.5px}
.paper.dense .dc-pledge,.paper.dense .dc-box{padding:4px 10px;font-size:10.5px}
.paper.dense .dc-box .en{font-size:10.5px}
.paper.dense .dc-lines i{height:18px}
.paper.dense .dc-t.blank td{height:20px}
.paper.dense .dc-foot{margin-top:6px;padding-top:6px}
.paper.dense .dc-foot img,.paper.dense .dc-foot .qrph{width:52px;height:52px}

/* ---------- sign-in gate, employees, settings ---------- */
.gate{min-height:100%;display:grid;place-items:center;padding:32px max(16px,env(safe-area-inset-right,0px)) 32px max(16px,env(safe-area-inset-left,0px))}
.gcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:32px 28px;width:min(420px,100%);display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.gcard img{height:120px;width:auto;background:var(--logo-plate);border-radius:12px;padding:6px}
.gcard h1{font-size:22px;font-weight:600}
.gcard p{max-width:34ch}
.btn.big{min-height:48px;padding:10px 24px;font-size:15.5px;width:100%}
.grow{display:flex;gap:8px;margin-top:6px}
.phead{display:flex;gap:10px 20px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:12px}
.phead .note{max-width:70ch;flex:1;min-width:240px}
.rows.emps .rhead,.rows.emps .row{grid-template-columns:120px minmax(0,1.3fr) minmax(0,1.2fr) minmax(0,1fr) 170px}
.rows.emps .row small{overflow-wrap:anywhere}
.settings{display:flex;flex-direction:column;gap:14px;max-width:820px}
.settings .chart h3{margin-bottom:6px}
.settings .chart .note{margin-bottom:12px}
.guide span{flex:1;min-width:200px}
#app{min-height:100%}
@media (max-width:860px){
  .rows.emps .row{grid-template-columns:minmax(0,1fr) auto}
  .rows.emps .row>span:nth-child(n+3){grid-column:1/-1}
}

/* ---------- supplier purchasing ---------- */
.pwrap{border:1px solid var(--line);border-radius:12px;overflow:auto;max-height:72vh;background:var(--surface)}
.pmx{border-collapse:separate;border-spacing:0;font-size:13px;min-width:100%}
.pmx th,.pmx td{border-bottom:1px solid var(--line);border-inline-end:1px solid var(--line);padding:7px 10px;text-align:start;vertical-align:top;white-space:nowrap;background:var(--surface)}
.pmx thead th{background:var(--surface-2);font-size:12px;font-weight:600;position:sticky;top:0;z-index:2}
.pmx thead th .pills{margin-top:4px;flex-wrap:nowrap}
.pmx thead th .pill{font-size:11px;padding:0 7px}
.pmx .it{white-space:normal;min-width:270px;max-width:340px;position:sticky;inset-inline-start:0;z-index:1}
.pmx thead .it{z-index:3}
.pmx .it small{display:block;color:var(--ink-2);font-size:11.5px;line-height:1.45;overflow-wrap:anywhere}
.pmx button{background:none;border:0;padding:0;font:inherit;font-weight:600;color:var(--brand-ink);text-decoration:underline;text-underline-offset:3px;text-align:start}
.pmx td.q{text-align:end;font-variant-numeric:tabular-nums;direction:ltr}
.pmx th.pd,.pmx td.pd{background:var(--ok-soft)}
.pmx th.pr,.pmx td.pr{background:var(--bad-soft)}
.pmx tfoot td{font-weight:600;background:var(--surface-2);position:sticky;bottom:0}
.pmx tfoot tr:first-child td{bottom:33px}
.pq{display:flex;flex-direction:column;gap:6px}
.pq label{display:grid;grid-template-columns:minmax(0,1fr) 120px;gap:10px;align-items:center;border-bottom:1px solid var(--line);padding-bottom:6px}
.pq label small{display:block;color:var(--ink-2);font-size:11.5px;overflow-wrap:anywhere}
.phead .as{flex:1;min-width:240px}
.kpi b{overflow-wrap:anywhere}
@media (max-width:700px){.pmx .it{position:static;min-width:220px}.pmx tfoot td{position:static}}
.kpi b span{font-size:inherit;color:inherit}
.kpi small span{font-size:inherit}

/* purchasing v2 */
.pmx td.ed{cursor:cell}
.pmx td.ed:hover{box-shadow:inset 0 0 0 2px var(--brand)}
.pmx td.ed .cellin{width:86px;min-height:28px;padding:2px 6px;text-align:end;border:2px solid var(--coral);border-radius:4px;direction:ltr}
details.more{position:relative}
details.more>summary{list-style:none;cursor:pointer}
details.more>summary::-webkit-details-marker{display:none}
details.more>div{position:absolute;z-index:5;inset-inline-end:0;top:calc(100% + 4px);background:var(--surface);border:1px solid var(--line-2);border-radius:10px;box-shadow:var(--shadow);padding:6px;display:flex;flex-direction:column;min-width:220px}
details.more>div button,details.more>div label{background:none;border:0;text-align:start;padding:8px 10px;border-radius:6px;font-weight:500;cursor:pointer;font-size:13.5px}
details.more>div button:hover,details.more>div label:hover{background:var(--surface-2)}
details.phelp{flex:1;min-width:240px;font-size:13px;color:var(--ink-2)}
details.phelp summary{cursor:pointer;font-weight:600;color:var(--brand-ink)}
details.phelp ol{margin:8px 0 0;padding-inline-start:20px;display:flex;flex-direction:column;gap:3px;max-width:75ch}
/* e-approval + company stamp */
.eap{color:#1d3a6e;font-weight:600;font-size:11px;white-space:nowrap}
.eap.no{color:#B93A2B}
.eap .ltr{font-weight:500}
.paper.dense .eap{font-size:10px}
.lt-sign .eap{display:inline-block;font-size:12px;line-height:1.7;margin:7px 0;padding:3px 14px;border:1px solid rgba(29,58,110,.4);border-radius:6px;white-space:normal}
.dc-seal img.co,.lt-sign img.co{transform:none;object-fit:contain}
.lt-sign img.co{width:132px;height:132px}
.stampset{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.stampset img{width:120px;height:120px;object-fit:contain;background:#fff;border:1px solid var(--line,#d5ddd8);border-radius:10px;padding:8px}
/* owner test mode */
.asbar{position:fixed;inset:auto 0 0 0;z-index:60;box-shadow:0 -4px 18px rgba(0,0,0,.18);padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;padding:8px max(16px,env(safe-area-inset-left,0px));background:#E2704F;color:#fff;font-size:13px;line-height:1.5;text-align:center}
.asbar .btn{background:#fff;color:#8a3519;border-color:#fff;flex:none}
.asbtn{display:inline-block;margin-top:6px;padding:2px 10px;border:1px solid var(--line-2);border-radius:999px;font-size:11.5px;font-weight:600;color:var(--accent,#557D6C);background:var(--surface)}
.asbtn:hover{border-color:currentColor}
.via{font-size:11.5px;color:#B5532F;font-weight:600;margin-top:2px}
.eap small{display:block;font-size:8.5px;font-weight:500;line-height:1.25;color:#B5532F;white-space:normal}
body:has(.asbar){padding-bottom:64px}
body:has(.asbar) .ov{bottom:46px}
body:has(.asbar) #toast{bottom:64px}
.dc-hint{font-size:10px;color:#6b7c74;margin-top:3px}
/* official letterhead */
.dc-head.lh{grid-template-columns:1fr 96px 1fr;align-items:end}
.dc-head.lh b{font-size:19px;line-height:1.25;color:#5f6b3a}
.dc-head.lh .en b{font-family:Georgia,'Times New Roman',serif;font-weight:700;letter-spacing:.3em;font-size:18px}
.dc-head.lh .ar b{font-size:22px;font-weight:700}
.dc-head.lh .s2{font-size:12.5px;color:#5f6b3a;font-weight:500;line-height:1.5}
.dc-head.lh .ids{font-size:9.5px;color:#3b4640;letter-spacing:.02em;margin-top:2px}
.dc-head.lh img{height:78px}
.paper.dense .dc-head.lh img{height:66px}
.paper.dense .dc-head.lh b{font-size:17px}.paper.dense .dc-head.lh .ar b{font-size:19px}
.dc-lh{display:grid;grid-template-columns:1fr 1fr;gap:14px;direction:ltr;border-top:1.5px solid #E2704F;margin-top:6px;padding-top:4px;font-size:8px;line-height:1.5;color:#3b4640}
.dc-lh .en{text-align:left;direction:ltr}.dc-lh .ar{text-align:right;direction:rtl}
.dc-lh span{display:block;white-space:nowrap}
.dc-lh em{display:block;font-style:normal;color:#C4572F;font-weight:600}
.dc-lh .en em{text-align:right}.dc-lh .ar em{text-align:left;direction:ltr}
.paper.dense .dc-lh{font-size:7.5px;margin-top:4px;padding-top:3px}
.dc-head.lh .ids span{display:inline}
/* employee files + weekly reports */
.hr-top{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.hr-acts{display:flex;gap:8px;flex-wrap:wrap}
.hr-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface);margin-top:14px}
.hr-t{width:100%;border-collapse:collapse;min-width:640px;font-size:13.5px}
.hr-t th{text-align:start;font-weight:600;font-size:12px;color:var(--muted,#667);padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
.hr-t td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.hr-t tbody tr{cursor:pointer}.hr-t tbody tr:hover,.hr-t tbody tr:focus-visible{background:var(--surface-2,rgba(85,125,108,.07));outline:none}
.hr-t tbody tr:last-child td{border-bottom:0}
.hr-t small,.hd-f small{display:block;font-size:11.5px;color:var(--muted,#667);margin-top:2px}
.hbar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;min-width:120px;max-width:220px}
.hbar i{display:block;height:100%;border-radius:99px;background:#557D6C}.hbar i.mid{background:#D9A441}.hbar i.low{background:#E2704F}
.hchip{display:inline-block;padding:1px 9px;border-radius:99px;font-size:11.5px;font-weight:600;white-space:nowrap;border:1px solid transparent}
.hchip.ok{background:rgba(85,125,108,.16);color:#3c6252}.hchip.warn{background:rgba(217,164,65,.2);color:#8a6410}.hchip.bad{background:rgba(226,112,79,.18);color:#B5432A}.hchip.mut{background:transparent;border-color:var(--line-2,var(--line));color:var(--muted,#667)}
:root[data-theme="dark"] .hchip.ok{color:#a9d3c1}:root[data-theme="dark"] .hchip.warn{color:#f0cf85}:root[data-theme="dark"] .hchip.bad{color:#f3a48d}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .hchip.ok{color:#a9d3c1}:root:not([data-theme="light"]) .hchip.warn{color:#f0cf85}:root:not([data-theme="light"]) .hchip.bad{color:#f3a48d}}
.hdots{display:inline-flex;gap:4px}.hdots i{width:11px;height:11px;border-radius:50%;background:var(--line);display:block}
.hdots i.ok{background:#557D6C}.hdots i.warn{background:#D9A441}.hdots i.bad{background:#E2704F}
.ov.side .sheet.hr-sheet{width:min(760px,100%)}
.htabs{display:flex;gap:4px;padding:8px 14px 0;border-bottom:1px solid var(--line);overflow-x:auto}
.htabs button{border:0;background:none;padding:8px 12px;font:inherit;font-size:13.5px;color:var(--muted,#667);border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
.htabs button.on{color:var(--fg,inherit);font-weight:600;border-bottom-color:#E2704F}
.hmiss{padding:9px 13px;border-radius:10px;background:rgba(226,112,79,.12);font-size:13px;line-height:1.7}.hmiss.ok{background:rgba(85,125,108,.14)}
.rq{color:#E2704F;font-style:normal}.ro{padding:8px 0;font-size:14px;border-bottom:1px dashed var(--line)}
.hchk{display:flex;gap:8px;align-items:center;font-size:13.5px}
.hdoc{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}.hdoc.need{border-color:rgba(226,112,79,.55)}
.hd-h{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.hd-h b{margin-inline-end:auto;font-size:14px}
.hd-f{display:flex;gap:8px;align-items:center;font-size:13px;padding-top:8px;border-top:1px dashed var(--line)}.hd-f>span{margin-inline-end:auto;min-width:0;overflow-wrap:anywhere}
.hrep{border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:13.5px;line-height:1.75;margin-top:10px}
.hr-h{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.hr-h b{margin-inline-end:auto}
.hrep h4,#wrform h4{font-size:12.5px;margin:10px 0 2px;color:var(--muted,#667);font-weight:600}.hrep ul{margin:0;padding-inline-start:20px}.hrep li{margin:2px 0}
.hreply{margin-top:8px;padding:8px 12px;border-radius:8px;background:rgba(85,125,108,.12)}.hreply p{margin:2px 0 0}
.hrev{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;margin-top:10px}.hrev textarea{flex:1;min-width:220px}
.hlist{display:flex;flex-direction:column}.hlist>div{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}.hlist>div>span:nth-child(2){margin-inline-end:auto;min-width:0}
#wrform{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
.hrow{display:flex;gap:8px}.hrow input{flex:1;min-width:0}.hrow select{flex:none;width:auto}
.hcarry{border:1px dashed var(--line-2,var(--line));border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;font-size:13.5px}.hcarry>div{display:flex;gap:8px;align-items:center}.hcarry span{margin-inline-end:auto}
.bad-t{color:#C4572F}
@media (max-width:560px){.hrow{flex-wrap:wrap}.hrow input{flex-basis:100%}}
.hpick{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;background:rgba(85,125,108,.06)}
.hp-h{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.hp-h b{font-size:13.5px}.hp-h select{width:auto;flex:1;min-width:160px;max-width:320px}

/* ---------- amounts in words ---------- */
const A1=['','واحد','اثنان','ثلاثة','أربعة','خمسة','ستة','سبعة','ثمانية','تسعة','عشرة','أحد عشر','اثنا عشر','ثلاثة عشر','أربعة عشر','خمسة عشر','ستة عشر','سبعة عشر','ثمانية عشر','تسعة عشر'];
const A10=['','','عشرون','ثلاثون','أربعون','خمسون','ستون','سبعون','ثمانون','تسعون'];
const A100=['','مئة','مئتان','ثلاثمئة','أربعمئة','خمسمئة','ستمئة','سبعمئة','ثمانمئة','تسعمئة'];
function ar3(n){const p=[],h=Math.floor(n/100),r=n%100;if(h)p.push(A100[h]);if(r){if(r<20)p.push(A1[r]);else{const o=r%10;p.push(o?A1[o]+' و'+A10[(r-o)/10]:A10[r/10])}}return p.join(' و')}
function arG(g,one,two,pl,acc){if(g===1)return one;if(g===2)return two;const r=g%100;if(r>=3&&r<=10)return ar3(g)+' '+pl;if(r===0)return ar3(g)+' '+one;if(r===1)return ar3(g-1)+' و'+one;if(r===2)return ar3(g-2)+' و'+two;return ar3(g)+' '+acc}
function arW(n){if(!n)return 'صفر';const m=Math.floor(n/1e6),t=Math.floor(n%1e6/1e3),u=n%1000,p=[];if(m)p.push(arG(m,'مليون','مليونان','ملايين','مليوناً'));if(t)p.push(arG(t,'ألف','ألفان','آلاف','ألفاً'));if(u)p.push(ar3(u));return p.join(' و')}
function tafqeet(x){const c=Math.round(x*100),n=Math.floor(c/100),h=c%100,r=n%100;let w=arW(n).replace(/(مئتان|ألفان|مليونان)$/,s=>s.slice(0,-1)).replace(/(ألف|مليون)اً$/,'$1');let s=w+' '+((r>=3&&r<=10)?'ريالات سعودية':'ريال سعودي');if(h)s+=' و'+arW(h)+' هللة';return 'فقط '+s+' لا غير'}
const E1=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
const E10=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
function en3(n){const p=[],h=Math.floor(n/100),r=n%100;if(h)p.push(E1[h]+' Hundred');if(r){if(r<20)p.push(E1[r]);else p.push(E10[Math.floor(r/10)]+(r%10?'-'+E1[r%10]:''))}return p.join(' and ')}
function enW(n){if(!n)return 'Zero';const m=Math.floor(n/1e6),t=Math.floor(n%1e6/1e3),u=n%1000,p=[];if(m)p.push(en3(m)+' Million');if(t)p.push(en3(t)+' Thousand');if(u)p.push(en3(u));return p.join(', ')}
function enAmt(x){const c=Math.round(x*100),n=Math.floor(c/100),h=c%100;return enW(n)+' Saudi Riyal'+(n===1?'':'s')+(h?' and '+enW(h)+' Halala'+(h===1?'':'s'):'')+' Only'}

/* ---------- request logic ---------- */
function approverFor(stage,e){let a=stage==='mgr'?e.mgr:R[stage];if(!a||a===e.key||!S.emps[a]||S.emps[a].active===false)a=R.ceo;return a||null}
function buildStages(type,e){let st=TYPES[type].route.map(k=>({key:k,by:approverFor(k,e),decision:null,at:null,note:''}));if(e.key===R.ceo)st=st.filter(s=>s.by!==R.ceo);return st}
const cur=r=>r.status==='pending'?r.stages.find(s=>!s.decision):null;
function since(r){const i=r.stages.findIndex(s=>!s.decision);return i<=0?r.at:r.stages[i-1].at}
const isLate=r=>r.status==='pending'&&now()-since(r)>2*DAY;
const lDays=d=>Math.round((d2ts(d.to)-d2ts(d.from))/DAY)+1;
function resume(to){let t=d2ts(to)+DAY;while([5,6].includes(new Date(t).getDay()))t+=DAY;return t}
function balance(id,reqs){const e=emp(id);return ANNUAL-(+e.used||0)-(reqs||S.reqs).filter(r=>r.emp===id&&r.type==='leave'&&r.status==='approved'&&r.d.kind==='annual').reduce((a,r)=>a+lDays(r.d),0)}
function pTotals(d){const sub=d.items.reduce((a,i)=>a+i.qty*i.price,0),vat=Math.round(sub*VAT*100)/100;return{sub,vat,total:Math.round((sub+vat)*100)/100}}
function schedule(r){const n=r.d.months,amt=r.d.amount,per=Math.floor(amt/n*100)/100,base=new Date(r.closedAt||r.at),rows=[];let left=amt;for(let i=1;i<=n;i++){const a=i===n?Math.round(left*100)/100:per;left=Math.round((left-a)*100)/100;rows.push({i,ts:new Date(base.getFullYear(),base.getMonth()+i,1,12).getTime(),a,left})}return rows}
function finalPatch(r,at){const p={status:'approved',closedAt:at,pendingWith:null};if(r.type==='leave'&&r.d.kind==='annual')p.snap=balance(r.emp);return p}
const custName=(d,l)=>d.asset||(OPT.item[d.item]?o2(OPT.item[d.item],l):'—');
async function decide(r,ok,note){const s=cur(r);if(!s)return null;const at=now(),i=r.stages.indexOf(s),stages=r.stages.map(x=>Object.assign({},x));stages[i]=Object.assign({},s,{decision:ok?'approved':'rejected',at,note:note||''});if(S.as)stages[i].via='admin';const p={stages};
 if(!ok)Object.assign(p,{status:'rejected',closedAt:at,pendingWith:null});else{const nx=stages.find(x=>!x.decision);if(nx)p.pendingWith=nx.by;else Object.assign(p,finalPatch(r,at))}
 await BE.updateRequest(r.id,p);return {p,next:ok?stages.find(x=>!x.decision)||null:null}}
function summary(r,l){const d=r.d;l=l||S.lang;const A=l==='ar';switch(r.type){
 case 'leave':return o2(OPT.leave[d.kind],l)+' · '+dayWord(lDays(d),l)+' · '+'\u2066'+fS(d2ts(d.from))+' – '+fS(d2ts(d.to))+'\u2069';
 case 'custody':return custName(d,l)+(d.model?' · '+d.model:'')+(d.qty>1?' × '+d.qty:'');
 case 'purchase':return (A?(d.items.length===1?'صنف واحد':d.items.length===2?'صنفان':d.items.length+' أصناف'):d.items.length+(d.items.length===1?' item':' items'))+' · '+fN(pTotals(d).total,2)+(A?' ر.س':' SAR');
 case 'maint':return o2(OPT.prio[d.prio],l)+' · '+d.loc;
 case 'letter':return (A?'إلى: ':'To: ')+(d.to||(A?'من يهمه الأمر':'Whom it may concern'))+' · '+(d.lang==='ar'?(A?'عربي':'Arabic'):(A?'إنجليزي':'English'))+(d.salary?(A?' · مع الراتب':' · with salary'):'');
 case 'advance':return fN(d.amount)+(A?' ر.س':' SAR')+' · '+monWord(d.months,l)}}

 case 'maint':return kv([[L('الموقع','Location'),esc(d.loc)],[L('التصنيف','Category'),o2(OPT.cat[d.cat])],[L('الأولوية','Priority'),o2(OPT.prio[d.prio])],[L('الوصف','Description'),esc(d.desc)]]);

function detail(m){const r=S.reqs.find(x=>x.id===m.id);if(!r){S.modal=null;return ''}const e=emp(r.emp),c=cur(r),mineTurn=c&&c.by===S.user;let dead=false;
 const tl=[`<li><span class="dot approved">✓</span><div><b>${L('قُدّم الطلب','Request submitted')}</b> — ${nm(e)}<div class="when">${fG(r.at)} · ${fH(r.at)} · <span class="num">${fT(r.at)}</span></div>${r.via?`<div class="via">${L('نُفّذ من حساب مدير النظام للتجربة','Done from the system admin account for testing')}</div>`:''}</div></li>`]
 .concat(r.stages.map((s,i)=>{const a=emp(s.by),prev=i?r.stages[i-1].at:r.at;let cls='',mark=i+1,st='';

  return `<li class="${s.decision==='rejected'?'rej':''}"><span class="dot ${cls}">${mark}</span><div><b>${o2(STAGE[s.key])}</b> — ${nm(a)} · ${st}
   ${s.at?`<div class="when">${fG(s.at)} · ${fH(s.at)} · <span class="num">${fT(s.at)}</span> · ${L('بعد','after')} ${fDur(s.at-prev)}</div>`:c===s?`<div class="when">${L('منذ','Waiting for')} ${fDur(now()-prev)}</div>`:''}
   ${s.via&&s.decision?`<div class="via">${L('نُفّذ من حساب مدير النظام للتجربة','Done from the system admin account for testing')}</div>`:''}${s.note?`<q>${esc(s.note)}</q>`:''}</div></li>`}));
 if(r.status==='approved')tl.push(`<li><span class="dot approved">✓</span><div><b>${L('اكتمل الاعتماد','Fully approved')}</b><div class="when">${L('المدة الكلية','Total time')}: ${fDur(r.closedAt-r.at)}</div></div></li>`);

/* ---------- new request ---------- */
function blank(t){const today=iso(now());return {leave:{kind:'annual',from:iso(now()+7*DAY),to:iso(now()+9*DAY),sub:'',reason:''},custody:{asset:'',model:'',qty:'1',purpose:''},purchase:{items:[{name:'',qty:1,price:''}],supplier:'',why:''},maint:{loc:'',cat:'ac',prio:'normal',desc:''},letter:{to:'',salary:'no',lang:S.lang},advance:{amount:'',months:'3',reason:''}}[t]}
function validate(t,d){const e={},mySal=S.sal[S.user],req=L('هذا الحقل مطلوب','This field is required');
 if(t==='leave'){if(!d.from)e.from=req;if(!d.to)e.to=req;if(d.from&&d.to){if(d2ts(d.to)<d2ts(d.from))e.to=L('تاريخ النهاية قبل تاريخ البداية','The end date is before the start date');else{const n=lDays(d);if(d.kind==='annual'&&n>balance(S.user))e.to=L(`عدد الأيام (${n}) يتجاوز رصيدك المتاح (${balance(S.user)} يوم)`,`${n} days is more than your balance (${balance(S.user)} days)`);if(n>60)e.to=L('الحد الأقصى للطلب الواحد 60 يوماً','A single request can cover at most 60 days')}}if((d.kind==='emergency'||d.kind==='unpaid')&&!d.reason.trim())e.reason=L('اكتب سبب الإجازة لهذا النوع','Give a reason for this leave type')}
 if(t==='custody'){if(!d.asset.trim())e.asset=req;const q=+d.qty;if(!(Number.isInteger(q)&&q>=1&&q<=999))e.qty=L('اكتب عدداً صحيحاً من 1 إلى 999.','Enter a whole number from 1 to 999.');if(!d.purpose.trim())e.purpose=req}
 if(t==='purchase'){d.items.forEach((i,k)=>{if(!String(i.name).trim()||!(+i.qty>=1)||!(+i.price>0))e['item'+k]=L('أكمل اسم الصنف والكمية وسعر الوحدة','Fill in the item name, quantity and unit price')});if(!d.why.trim())e.why=req}
 if(t==='maint'){if(!d.loc.trim())e.loc=req;if(!d.desc.trim())e.desc=req}
 if(t==='advance'){const a=+d.amount,mx=mySal>0?mySal*2:Infinity;if(!(a>0))e.amount=L('أدخل مبلغاً أكبر من صفر','Enter an amount above zero');else if(a>mx)e.amount=L(`الحد الأعلى للسلفة راتبان (${fN(mx)} ر.س)`,`The limit is two salaries (SAR ${fN(mx)})`);if(!d.reason.trim())e.reason=req}
 if(t==='letter'&&d.salary==='yes'&&!(mySal>0))e.salary=L('لا يوجد راتب مسجّل لك في النظام. اختر «لا» أو راجع الموارد البشرية.','No salary is on file for you. Choose “No” or contact HR.');
 return e}
function liveBox(t,d){const mySal=S.sal[S.user];

document.addEventListener('submit',ev=>{ev.preventDefault();if(ev.target.id==='nform')submit();else if(ev.target.id==='eform')saveEmp();else if(ev.target.id==='sform')saveSettings();else if(ev.target.id==='hrform')hrSave();else if(ev.target.id==='wtform'){const v=document.querySelector('#wt-text').value;BE.saveConfig('wrtasks',{text:v}).then(()=>{S.modal=null;toast(L('حُفظت المهام الجاهزة.','Ready-made tasks saved.'));hrLoad(true)}).catch(e=>{console.error(e);toast(saveErr(e))})}else if(ev.target.id==='wrform')wrSave(true);else if(ev.target.id==='pofform')savePof();else if(ev.target.id==='pitform')savePit();else if(ev.target.id==='psupform')savePsup();else if(ev.target.id==='payform'){const a=+pval('payform','amt'),dt=pval('payform','date'),nt=pval('payform','note');if(!(a>0)){toast(L('أدخل مبلغ الدفعة.','Enter the payment amount.'))}else poPatch(d=>{d.pays.push({amt:Math.round(a*100)/100,date:dt,note:nt})},L('أُضيفت الدفعة.','Payment added.'))}else if(ev.target.id==='vform'){S.vq=$('#vq').value;doVerify()}});

const th=store.get('uti.theme');if(th==='dark'||th==='light')document.documentElement.dataset.theme=th;
function onUser(email,verified){H={key:'',busy:false,ok:false,files:{},docs:[],reps:[],notes:{}};S.wr=null;S.as=null;S.realUser=null;S.reqs=[];S.sups={};S.pos=[];S.emps={};S.sal={};S.ready=false;S.err=null;S.modal=null;R={hr:'',fin:'',ceo:''};CO=Object.assign({},CO_DEF);
 if(!email){S.user=null;S.auth='out';render();return false}
 S.user=email.toLowerCase();if(!S.user.endsWith('@'+DOMAIN)||!verified){S.auth='denied';render();return false}
 S.auth='in';S.loginErr=null;render();return true}
const pslug=v=>String(v).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'x';
function fbBE(){
 firebase.initializeApp(CFG.firebase);const auth=firebase.auth(),db=firebase.firestore();let unsubs=[],started=false,wasBoss=false;
 const E=db.collection('employees'),RQ=db.collection('requests'),SAL=db.collection('salaries'),CF=db.collection('config');
 const stop=()=>{unsubs.forEach(u=>{try{u()}catch(e){}});unsubs=[];started=false};
 const fail=e=>{console.error(e);if(!S.ready){S.err=(e&&e.code)||'error';render()}else toast(L('تعذّر تحميل بعض البيانات. حدّث الصفحة.','Some data could not load. Reload the page.'))};
 function watchData(){const u=S.user,src=[new Map(),new Map(),new Map()];
  const merge=()=>{const m=new Map();src.forEach(s=>s.forEach((v,k)=>m.set(k,v)));S.reqs=[...m.values()];refresh()};
  const sub=(q,i)=>unsubs.push(q.onSnapshot(s=>{const mp=new Map();s.forEach(d=>mp.set(d.id,Object.assign({},d.data(),{id:d.id})));src[i]=mp;merge()},fail));
  if(isBoss(u))sub(RQ,0);else{sub(RQ.where('emp','==',u),0);sub(RQ.where('empMgr','==',u),1);sub(RQ.where('approvers','array-contains',u),2)}
  if(canSeeSal())unsubs.push(SAL.onSnapshot(s=>{const m={};s.forEach(d=>{m[d.id]=d.data().sal});S.sal=m;refresh()},fail));
  else if(S.emps[u])unsubs.push(SAL.doc(u).onSnapshot(d=>{S.sal=d.exists?{[u]:d.data().sal}:{};refresh()},fail));
  if(canPurch()){unsubs.push(db.collection('suppliers').onSnapshot(q=>{const m={};q.forEach(d=>{m[d.id]=Object.assign({},d.data(),{id:d.id})});S.sups=m;refresh()},fail));unsubs.push(db.collection('porders').onSnapshot(q=>{const a=[];q.forEach(d=>a.push(Object.assign({},d.data(),{id:d.id})));S.pos=a;refresh()},fail))}}
 function watch(){let gotE=false,gotR=false;
  const go=()=>{if(!gotE||!gotR)return;S.ready=true;const b=asReal(()=>isBoss(S.user)+'|'+canSeeSal()+'|'+canPurch());if(!started){started=true;wasBoss=b;if(S.emps[S.user]||isAdmin())watchData()}else if(b!==wasBoss){location.reload();return}refresh()};
  unsubs.push(CF.doc('company').onSnapshot(d=>{CO=Object.assign({},CO_DEF,d.exists?d.data():{});if(S.ready)refresh()},fail));
  unsubs.push(CF.doc('routing').onSnapshot(d=>{R=Object.assign({hr:'',fin:'',ceo:''},d.exists?d.data():{});gotR=true;go()},fail));
  unsubs.push(E.onSnapshot(q=>{const m={};q.forEach(d=>{m[d.id]=Object.assign({},d.data(),{key:d.id})});S.emps=m;gotE=true;go()},fail))}
 const HC=n=>db.collection(n),qd=q=>q.docs.map(d=>Object.assign(d.data(),{id:d.id}));
 const hrApi={
  async hrLoad(u,all){const o={files:{},docs:[],reps:[],notes:{}};try{const t=await CF.doc('wrtasks').get();o.tasks=t.exists?(t.data().text||''):''}catch(e){o.tasks=''}if(all){const [f,d,r,n]=await Promise.all([HC('hrfiles').get(),HC('hrdocs').get(),HC('wreports').get(),HC('hrnotes').get()]);f.forEach(x=>{o.files[x.id]=x.data()});o.docs=qd(d);o.reps=qd(r);n.forEach(x=>{o.notes[x.id]=x.data()})}
   else{const [f,d,r]=await Promise.all([HC('hrfiles').doc(u).get(),HC('hrdocs').where('emp','==',u).get(),HC('wreports').where('emp','==',u).get()]);if(f.exists)o.files[u]=f.data();o.docs=qd(d);o.reps=qd(r)}return o},
  hrSaveFile(k,data){return HC('hrfiles').doc(k).set(data,{merge:true})},
  hrSaveNote(k,data){return HC('hrnotes').doc(k).set(data)},
  async hrPutDoc(meta,parts){const ref=HC('hrdocs').doc();await ref.set(meta);try{for(let i=0;i<parts.length;i++)await ref.collection('parts').doc(String(i)).set({d:parts[i]})}catch(e){try{await ref.delete()}catch(_){}throw e}return ref.id},
  async hrGetDoc(id,n){const a=[];for(let i=0;i<(n||1);i++){const p=await HC('hrdocs').doc(id).collection('parts').doc(String(i)).get();a.push(p.exists?p.data().d:'')}return a.join('')},
  async hrDelDoc(id,n){for(let i=0;i<(n||1);i++)await HC('hrdocs').doc(id).collection('parts').doc(String(i)).delete();await HC('hrdocs').doc(id).delete()},
  hrSaveRep(id,data,isNew){return isNew?HC('wreports').doc(id).set(data):HC('wreports').doc(id).update(data)},
  hrPatchRep(id,p){return HC('wreports').doc(id).update(p)}};
 return {...hrApi,
  init(){auth.onAuthStateChanged(async u=>{stop();S.owner=false;try{if(u&&u.email&&CFG.ownerHash)S.owner=(await sha(u.email.toLowerCase()))===CFG.ownerHash}catch(e){}if(onUser(u&&u.email,u&&u.emailVerified))watch()})},
  signIn(){const p=new firebase.auth.GoogleAuthProvider();p.setCustomParameters({hd:DOMAIN,prompt:'select_account'});return auth.signInWithPopup(p)},
  signOut(){return auth.signOut()},
  async nextRef(){const y=new Date().getFullYear(),ref=db.collection('counters').doc(String(y));const n=await db.runTransaction(async t=>{const d=await t.get(ref),n=(d.exists?d.data().n:0)+1;if(d.exists)t.update(ref,{n});else t.set(ref,{n});return n});return 'UTI-'+y+'-'+String(n).padStart(4,'0')},
  async addRequest(r){const d=RQ.doc(),data=Object.assign({},r);delete data.id;await d.set(data);return d.id},
  updateRequest(id,p){return RQ.doc(id).update(p)},
  saveEmployee(key,data,sal){const b=db.batch();b.set(E.doc(key),data,{merge:true});if(sal===null)b.delete(SAL.doc(key));else if(sal!==undefined)b.set(SAL.doc(key),{sal});return b.commit()},
  async importEmployees(items){for(let i=0;i<items.length;i+=200){const b=db.batch();items.slice(i,i+200).forEach(x=>{b.set(E.doc(x.key),x.data,{merge:true});if(x.sal!==undefined)b.set(SAL.doc(x.key),{sal:x.sal})});await b.commit()}},
  async savePurch(col,id,data){const ref=id?db.collection(col).doc(id):db.collection(col).doc();await ref.set(data);return ref.id},
  delPurch(col,id){return db.collection(col).doc(id).delete()},
  async delSupplier(id){const q=await db.collection('porders').where('sup','==',id).get(),b=db.batch();q.forEach(d=>b.delete(d.ref));b.delete(db.collection('suppliers').doc(id));await b.commit()},
  async importPurch(j){const sid=pslug(j.supplier.code),b=db.batch();b.set(db.collection('suppliers').doc(sid),Object.assign({createdAt:Date.now()},j.supplier));j.orders.forEach((o,i)=>{b.set(db.collection('porders').doc(sid+'_'+pslug(o.no||String(i+1))+'_'+(i+1)),Object.assign({pays:[],lines:[],createdAt:Date.now()},o,{sup:sid,seq:i+1}))});await b.commit();return sid},
  saveConfig(id,data){return CF.doc(id).set(data,{merge:true})}
 }}
/* Local preview backend (only when UTI_CONFIG.mock is set): same screens, data kept in this browser. */
function mockBE(){const K='uti.mock.v1',UK='uti.mock.user';let M=null;try{M=JSON.parse(store.get(K)||'null')}catch(e){}
 if(!M)M=Object.assign({emps:{},sal:{},reqs:[],routing:{hr:'',fin:'',ceo:''},company:{},n:0},JSON.parse(JSON.stringify(CFG.mock.data||{})));
 const cl=x=>JSON.parse(JSON.stringify(x)),persist=()=>store.set(K,JSON.stringify(M));
 function sync(){const u=S.user;S.emps={};Object.keys(M.emps).forEach(k=>{S.emps[k]=Object.assign(cl(M.emps[k]),{key:k})});R=Object.assign({hr:'',fin:'',ceo:''},M.routing);CO=Object.assign({},CO_DEF,M.company);
  if(!S.emps[u]&&!isAdmin()){S.err='permission-denied';render();return}
  S.sal=canSeeSal()?cl(M.sal):(M.sal[u]!=null?{[u]:M.sal[u]}:{});
  if(canPurch()){S.sups={};Object.keys(M.sups||{}).forEach(k=>{S.sups[k]=Object.assign(cl(M.sups[k]),{id:k})});S.pos=cl(M.pos||[])}else{S.sups={};S.pos=[]}
  S.reqs=cl(M.reqs).filter(r=>isBoss(u)||r.emp===u||r.empMgr===u||r.approvers.includes(u));S.ready=true;refresh()}
 const login=e=>{if(e)store.set(UK,e);else store.del(UK);if(onUser(e,true))sync()};
 const MH=()=>M.hr||(M.hr={files:{},docs:{},parts:{},reps:{},notes:{}}),deny=()=>{throw {code:'permission-denied'}};
 return {mock:true,login,resync:sync,
  async hrLoad(u,all){const h=MH(),o={files:{},docs:[],reps:[],notes:{},tasks:(M.wrtasks||{}).text||''};all=all&&canManage();Object.keys(h.files).forEach(k=>{if(all||k===u)o.files[k]=cl(h.files[k])});o.docs=Object.keys(h.docs).map(id=>Object.assign(cl(h.docs[id]),{id})).filter(d=>all||d.emp===u);o.reps=Object.keys(h.reps).map(id=>Object.assign(cl(h.reps[id]),{id})).filter(d=>all||d.emp===u);if(all)o.notes=cl(h.notes);return o},
  async hrSaveFile(k,data){if(!canManage())deny();const h=MH();h.files[k]=Object.assign({},h.files[k],data);persist()},
  async hrSaveNote(k,data){if(!canManage())deny();MH().notes[k]=data;persist()},
  async hrPutDoc(meta,parts){if(!canManage()&&meta.emp!==S.user)deny();const h=MH(),id='d'+now().toString(36)+Math.random().toString(36).slice(2,6);h.docs[id]=meta;h.parts[id]=parts;persist();return id},
  async hrGetDoc(id){const h=MH();if(!h.docs[id]||(!canManage()&&h.docs[id].emp!==S.user))deny();return h.parts[id].join('')},
  async hrDelDoc(id){if(!canManage())deny();const h=MH();delete h.docs[id];delete h.parts[id];persist()},
  async hrSaveRep(id,data,isNew){const h=MH(),o=h.reps[id];if(data.emp!==S.user&&!isAdmin())deny();if(o&&o.status==='sent')deny();h.reps[id]=Object.assign({},o,data);persist()},
  async hrPatchRep(id,p){if(!canManage())deny();const h=MH();h.reps[id]=Object.assign({},h.reps[id],p);persist()},
  init(){login(store.get(UK)||null)},
  signIn(){login(CFG.mock.user);return Promise.resolve()},
  signOut(){login(null);return Promise.resolve()},
  async nextRef(){M.n++;persist();return 'UTI-'+new Date().getFullYear()+'-'+String(M.n).padStart(4,'0')},
  async addRequest(r){const d=cl(r);d.id='m'+now().toString(36)+M.reqs.length;M.reqs.push(d);persist();sync();return d.id},
  async updateRequest(id,p){const r=M.reqs.find(x=>x.id===id);if(!r||r.pendingWith!==S.user)throw {code:'permission-denied'};Object.assign(r,cl(p));persist();sync()},
  async saveEmployee(key,data,sal){if(!canManage())throw {code:'permission-denied'};M.emps[key]=Object.assign({},M.emps[key],data);if(sal===null)delete M.sal[key];else if(sal!==undefined)M.sal[key]=sal;persist();sync()},
  async importEmployees(items){if(!canManage())throw {code:'permission-denied'};items.forEach(x=>{M.emps[x.key]=Object.assign({},M.emps[x.key],x.data);if(x.sal!==undefined)M.sal[x.key]=x.sal});persist();sync()},
  async savePurch(col,id,data){if(!canPurch())throw {code:'permission-denied'};M.sups=M.sups||{};M.pos=M.pos||[];const nid=id||'p'+now().toString(36)+Math.round(Math.random()*999);if(col==='suppliers')M.sups[nid]=cl(data);else{const i=M.pos.findIndex(o=>o.id===nid),d=Object.assign(cl(data),{id:nid});if(i>=0)M.pos[i]=d;else M.pos.push(d)}persist();sync();return nid},
  async delPurch(col,id){if(!canPurch())throw {code:'permission-denied'};M.pos=(M.pos||[]).filter(o=>o.id!==id);persist();sync()},
  async delSupplier(id){if(!canPurch())throw {code:'permission-denied'};M.pos=(M.pos||[]).filter(o=>o.sup!==id);delete M.sups[id];persist();sync()},
  async importPurch(j){if(!canPurch())throw {code:'permission-denied'};M.sups=M.sups||{};M.pos=M.pos||[];const sid=pslug(j.supplier.code);M.sups[sid]=cl(j.supplier);M.pos=M.pos.filter(o=>o.sup!==sid);j.orders.forEach((o,i)=>{M.pos.push(Object.assign({pays:[],lines:[]},cl(o),{id:sid+'_'+(i+1),sup:sid,seq:i+1}))});persist();sync();return sid},
  async saveConfig(id,data){if(!isAdmin())throw {code:'permission-denied'};M[id]=Object.assign({},M[id],data);persist();sync()}
 }}
